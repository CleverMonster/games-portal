<!DOCTYPE html><html><body style="margin:0;overflow:hidden"><canvas id="c" style="width:100vw;height:100vh;display:block"></canvas>
<script>
const c=document.getElementById('c'),gl=c.getContext('webgl');
const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o};
const p=gl.createProgram();
gl.attachShader(p,sh(gl.VERTEX_SHADER,`attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`));
gl.attachShader(p,sh(gl.FRAGMENT_SHADER,`precision highp float;uniform vec2 r,m;uniform float t;
float sd(vec3 p,vec3 c,float s){return length(p-c)-s;}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float map(vec3 p){
 float d=sd(p,vec3(m*1.6,0.),.55);
 for(int i=0;i<4;i++){float f=float(i)*1.57+t*.6;d=smin(d,sd(p,vec3(cos(f)*1.1,sin(f*1.3)*.8,sin(f)*.6),.4),.7);}
 return d;}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;vec3 ro=vec3(0,0,-4),rd=normalize(vec3(uv,1.5));
 float d,tt=0.;for(int i=0;i<64;i++){d=map(ro+rd*tt);if(d<.002||tt>10.)break;tt+=d;}
 vec3 col=mix(vec3(.96,.93,.9),vec3(.88,.9,.95),uv.y+.5);
 if(d<.01){vec3 p=ro+rd*tt;vec2 e=vec2(.002,0);
  vec3 n=normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));
  float l=dot(n,normalize(vec3(-.5,.8,-.6)))*.5+.5;
  col=mix(vec3(.95,.55,.45),vec3(.99,.85,.7),l)*(.6+.5*l)+pow(max(0.,dot(reflect(rd,n),normalize(vec3(-.5,.8,-.6)))),24.)*.4;}
 gl_FragColor=vec4(col,1.);}`));
gl.linkProgram(p);gl.useProgram(p);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(p,n);let mx=0,my=0,sx=0,sy=0;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=.5-e.clientY/innerHeight});
(function f(t){const w=c.clientWidth,h=c.clientHeight;if(c.width!==w||c.height!==h){c.width=w;c.height=h}
 gl.viewport(0,0,w,h);sx+=(mx-sx)*.1;sy+=(my-sy)*.1;
 gl.uniform2f(U('r'),w,h);gl.uniform2f(U('m'),sx,sy);gl.uniform1f(U('t'),t*.001);
 gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(f)})(0);
</script></body></html>
