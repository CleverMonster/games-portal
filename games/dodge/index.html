<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Game</title></head><body><script src="../_shared/gl2d.js"></script><script>
// DODGE — drag to move, avoid the black squares. Mono / brutalist.
const g=GL2D({fg:'#000'});
let en=[],state='idle',score=0,spawn=0,px=0,py=0,lock=0,best=0;
const S=()=>Math.min(g.W,g.H)*.045;
const target=()=>({x:g.ptr.x,y:g.ptr.y-(g.ptr.type==='touch'?S()*2.5:0)});
g.msg('DODGE<br><small>drag to move · avoid black</small><br><br>TAP TO START');
g.onDown=()=>{if(state==='run'||performance.now()<lock)return;
  state='run';en=[];score=0;spawn=0;const t=target();px=t.x;py=t.y;g.msg(null)};
g.loop(dt=>{
  g.clear('#ffffff');const s=S();
  if(state==='run'){
    const t=target();px+=(t.x-px)*Math.min(1,dt*20);py+=(t.y-py)*Math.min(1,dt*20);
    score+=dt;spawn-=dt;
    if(spawn<=0){spawn=Math.max(.14,.55-score*.01);
      const sz=s*(1+Math.random()*2.2),side=Math.random()*4|0,sp=Math.min(g.W,g.H)*(.28+score*.008)*(.7+Math.random()*.6);
      const e={s:sz};
      if(side<2){e.x=Math.random()*g.W;e.y=side?g.H+sz:-sz;e.vx=0;e.vy=side?-sp:sp}
      else{e.y=Math.random()*g.H;e.x=side===2?-sz:g.W+sz;e.vy=0;e.vx=side===2?sp:-sp}
      en.push(e)}
    for(const e of en){e.x+=e.vx*dt;e.y+=e.vy*dt;
      if(Math.abs(e.x-px)<(e.s+s)/2&&Math.abs(e.y-py)<(e.s+s)/2){
        state='over';lock=performance.now()+500;best=Math.max(best,score);
        g.msg('GAME OVER<br>'+score.toFixed(1)+'s · best '+best.toFixed(1)+'s<br><br>TAP TO RETRY')}}
    en=en.filter(e=>e.x>-300&&e.x<g.W+300&&e.y>-300&&e.y<g.H+300);
    g.score(score.toFixed(1));
  }
  for(const e of en)g.rect(e.x-e.s/2,e.y-e.s/2,e.s,e.s,'#000000');
  if(state!=='idle')g.rect(px-s/2,py-s/2,s,s,'#ff2a1a');
});
</script></body></html>
